name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x64
            rust_target: x86_64-pc-windows-msvc
          - target: arm64
            rust_target: aarch64-pc-windows-msvc

    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 ci.yml 的同名步骤**刻意保持同一份逻辑**（只多一个矩阵 target），
      # 免得两处漂移。工具链版本同样取自仓库根的 rust-toolchain.toml。
      # ⚠️ 矩阵 target 必须装在**固定**的那个工具链上：若沿用浮动的 @stable 装
      # aarch64，而 cargo 随后按 rust-toolchain.toml 切到别的版本，交叉编译会因
      # 该版本没有 aarch64 的 std 而失败。
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          pinned=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          if [ -z "$pinned" ]; then
            echo "::error::rust-toolchain.toml 里读不到 channel（文件被改名或改了格式？）"
            exit 1
          fi
          echo "rust-toolchain.toml 固定版本：$pinned"
          rustup toolchain install "$pinned" --profile minimal \
            --target "${{ matrix.rust_target }}" --no-self-update
          rustup default "$pinned"
          active=$(rustup show active-toolchain)
          echo "生效工具链：$active"
          case "$active" in
            "$pinned"*) echo "OK：正在使用固定的工具链 $pinned" ;;
            *)
              echo "::error::工具链漂移 —— rust-toolchain.toml 固定 $pinned，但生效的是 $active"
              exit 1
              ;;
          esac

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-v2-

      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+(-.+)?$') {
            throw "Invalid tag format: '$tag' (expected vX.Y.Z or vX.Y.Z-pre)"
          }
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Update version in config files
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          # Update tauri.conf.json
          $tauri = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 10 | Set-Content "src-tauri/tauri.conf.json" -Encoding UTF8

          # Update Cargo.toml (only update version in [package] section)
          $cargo = Get-Content "src-tauri/Cargo.toml"
          $inPackage = $false
          for ($i = 0; $i -lt $cargo.Length; $i++) {
            if ($cargo[$i] -match '^\[package\]') { $inPackage = $true }
            elseif ($cargo[$i] -match '^\[') { $inPackage = $false }
            if ($inPackage -and $cargo[$i] -match '^version\s*=\s*".*"') {
              $cargo[$i] = "version = `"$version`""
            }
          }
          $cargo -join "`n" | Set-Content "src-tauri/Cargo.toml" -Encoding UTF8 -NoNewline

          # Update package.json
          $pkg = Get-Content "package.json" -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 10 | Set-Content "package.json" -Encoding UTF8

          # settings.html 关于页版本由 get_app_version 命令运行时动态读取，无需改写

      - name: Install npm dependencies
        run: npm ci

      - name: Build NSIS installer (${{ matrix.target }})
        run: npm run tauri build -- --bundles nsis --target ${{ matrix.rust_target }}

      # 生成 Store 图标（仅正式版）
      - name: Generate Store icons
        if: ${{ !contains(github.ref_name, '-') }}
        run: npx tauri icon src-tauri/icons/128x128.png

      # 打包 MSIX（仅正式版，供上传到 Partner Center）
      - name: Build MSIX package (${{ matrix.target }})
        if: ${{ !contains(github.ref_name, '-') }}
        shell: pwsh
        env:
          MSIX_PUBLISHER_DN: ${{ secrets.MSIX_PUBLISHER_DN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}.0"
          & src-tauri/msix/stage.ps1 -Target ${{ matrix.target }} -Version $version
          & src-tauri/msix/pack.ps1 -Target ${{ matrix.target }} -Version $version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe

      # 上传 MSIX 产物（仅正式版）
      - name: Upload MSIX artifact
        if: ${{ !contains(github.ref_name, '-') }}
        uses: actions/upload-artifact@v4
        with:
          name: msix-${{ matrix.target }}
          path: src-tauri/msix/output/*.msix

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 需要 checkout 才能读到仓库里的手写 release notes（tmp-release-notes.md）
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Check if pre-release
        id: prerelease
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      # 手写 release notes（面向用户的可感知改动）优先；缺失时回退到自动生成的变更列表。
      # action v3 对「空 body_path」与「文件不存在」都会静默回退，不会让发布失败。
      # 二者只取其一：本仓不用 PR，自动生成的正文实际只有一行 compare 链接，而手写正文
      # 末尾已自带该链接 ⇒ 同时开启只会把同一个链接打印两遍（v1.3.7-beta.1 实测如此）。
      - name: Resolve release notes
        id: notes
        shell: bash
        run: |
          candidate="tmp-release-notes.md"
          if [ -f "$candidate" ]; then
            echo "path=$candidate" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "使用手写 release notes：$candidate（不再追加自动变更列表）"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
            echo "未找到 $candidate，回退到自动生成的变更列表"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE == 'true' }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            artifacts/*.exe
            artifacts/*.msix
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}

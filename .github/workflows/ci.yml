name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-ci-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ci-cargo-v2-

      - name: Frontend integrity checks
        run: node tools/check.mjs

      - name: Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Cargo check (deny warnings)
        run: cargo check
        env:
          RUSTFLAGS: -D warnings
        working-directory: src-tauri

      # 与 tools/pre-commit 共用同一条命令（含 20 条存量基线，单一来源见该脚本）
      - name: Cargo clippy (deny warnings, baseline-pinned)
        run: node tools/check-clippy.mjs

      - name: Cargo test
        run: cargo test
        working-directory: src-tauri

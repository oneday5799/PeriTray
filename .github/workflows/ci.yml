name: CI

on:
  push:
    # ⛔ 写 `["**"]` 而**不是**留空：`on: push:` 两个 ref 过滤器都不写时，
    # tag 推送**也会**触发 ⇒ 每次打 tag 都会让这套闸门（一次完整 Tauri 构建）跑一遍，
    # 与 release.yml 重复且无收益。只写 `branches` 才是「所有分支、排除 tag」。
    branches: ["**"]
  pull_request:

# 同一 ref 上连续推送时取消过期任务（闸门是全量重跑，后一次已覆盖前一次）。
# 本仓不用 PR，故 `github.ref` 对 push 事件就是分支名、不会与 PR 流撞组。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    env:
      # dtolnay/rust-toolchain 的 action 原本会设这个值，换成手写步骤后显式保留：
      # CI 里增量编译只让 target 膨胀、缓存变大，没有收益。
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust 工具链版本固定在仓库根的 rust-toolchain.toml（本地与 CI 单一来源；
      # 固定原因见该文件头注释——浮动的 stable 曾造成「本地绿、CI 红」）。
      # 本步**显式按该文件安装，并断言生效工具链就是它**：rustup 的优先级是
      # RUSTUP_TOOLCHAIN 环境变量 > rust-toolchain.toml > rustup default，
      # 故将来若有人往 env 里塞 RUSTUP_TOOLCHAIN，本步会当场变红，
      # 而不是让本地与 CI 静默跑在两个版本上。
      # 该断言已在本机做过可证伪验证：注入 RUSTUP_TOOLCHAIN ⇒ exit 1；
      # 把 channel 从文件里删掉 ⇒ 同样 exit 1。
      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          pinned=$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml)
          if [ -z "$pinned" ]; then
            echo "::error::rust-toolchain.toml 里读不到 channel（文件被改名或改了格式？）"
            exit 1
          fi
          echo "rust-toolchain.toml 固定版本：$pinned"
          rustup toolchain install "$pinned" --profile minimal \
            --component rustfmt --component clippy --no-self-update
          rustup default "$pinned"
          active=$(rustup show active-toolchain)
          echo "生效工具链：$active"
          case "$active" in
            "$pinned"*) echo "OK：CI 正在使用固定的工具链 $pinned" ;;
            *)
              echo "::error::工具链漂移 —— rust-toolchain.toml 固定 $pinned，但生效的是 $active"
              exit 1
              ;;
          esac

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-ci-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-ci-cargo-v2-

      - name: Frontend integrity checks
        run: node tools/check.mjs

      # §8.3 第 15/18 条：文档表格列数体检 + 自指型断言体检
      # （单一来源见该脚本；本地收尾验收由 tools/verify-final.sh 调用同一条命令）
      - name: Docs audit (tables + self-referential pointers)
        run: node tools/doc-table-audit.mjs

      - name: Rust formatting
        run: cargo fmt --check
        working-directory: src-tauri

      - name: Cargo check (deny warnings)
        run: cargo check
        env:
          RUSTFLAGS: -D warnings
        working-directory: src-tauri

      # 与 tools/pre-commit 共用同一条命令（含存量基线，条数见该脚本的 BASELINE_ALLOW）
      - name: Cargo clippy (deny warnings, baseline-pinned)
        run: node tools/check-clippy.mjs

      - name: Cargo test
        run: cargo test
        working-directory: src-tauri
